[project]
name = "uno-local-api"
version = "0.1.0"
description = "Two-agent UNO environment with REST tools and a read-only observer dashboard."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
uno-simple-agents = "uno_api.agents.simple_agent:main"
uno-ollama-agents = "uno_api.agents.ollama_agent:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

