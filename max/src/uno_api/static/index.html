<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNO Agent Arena</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="arena">
      <header class="arena-header">
        <div>
          <h1>UNO Agent Arena</h1>
          <p id="statusText">Waiting for agent activity.</p>
        </div>
        <div class="header-actions">
          <button id="soundToggle" type="button">Enable Sound</button>
          <span id="gameId">-</span>
        </div>
      </header>

      <section class="table">
        <section class="agent-zone agent-zone-top" id="agentTop"></section>

        <section class="center-stage">
          <div class="pile draw-pile" id="drawPile">
            <span>Draw</span>
            <strong id="drawCount">0</strong>
          </div>
          <div class="impact-layer" id="impactLayer"></div>
          <div class="pile discard-pile" id="topCard">
            <span>Top</span>
            <strong>-</strong>
          </div>
        </section>

        <section class="ticker">
          <article>
            <span>Status</span>
            <strong id="gameStatus">-</strong>
          </article>
          <article>
            <span>Turn</span>
            <strong id="turnCount">0</strong>
          </article>
          <article>
            <span>Current Agent</span>
            <strong id="currentTurn">-</strong>
          </article>
          <article>
            <span>Direction</span>
            <strong id="direction">-</strong>
          </article>
        </section>

        <section class="message-strip" id="message">No active game.</section>

        <section class="agent-zone agent-zone-bottom" id="agentBottom"></section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
